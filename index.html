<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wdth@1,18..144,87..112&family=Parkinsans:wght@300..800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <title>The Fundamentals - JavaScript Part 2</title>
</head>

<body>
  <div class="container">

    <div class="header-row">
      <h1>Frmewrk</h1>
      <div class="stats-container">
        <div class="stat-box image loading">
          <p class="stat-label">Images</p>
          <p class="stat-number" id="imageCount"></p>
        </div>
        <div class="stat-box comments loading">
          <p class="stat-label">Comments</p>
          <p class="stat-number" id="commentCount"></p>
        </div>
        <div class="stat-box likes loading">
          <p class="stat-label">Likes</p>
          <p class="stat-number" id="likeCount"></p>
        </div>
      </div>
    </div>

    <h3>Top Likes</h3>
    <div class="top-likes-container">
      <div class="top-likes">
        <div class="top-like loading">
          <div class="score">
            <span class="rank">1</span>
            <span class="like-count" id="topLike1">0</span>
          </div>
          <img src="image1.jpg" alt="Top liked image 1">
        </div>
        <div class="top-like loading">
          <div class="score">
            <span class="rank">2</span>
            <span class="like-count" id="topLike2">0</span>
          </div>
          <img src="image2.jpg" alt="Top liked image 2">
        </div>
        <div class="top-like loading">
          <div class="score">
            <span class="rank">3</span>
            <span class="like-count" id="topLike3">0</span>
          </div>
          <img src="image3.jpg" alt="Top liked image 3">
        </div>
      </div>
    </div>

    <div id="gallery-container">
    </div>

    <button id="load-more" class="load-more-btn">Load More</button>

    <!-- AXEL MODAL CONTRIBUTIONS -->
    <div id="image-modal" class="modal hidden">
      <span id="close-modal">&times;</span>
      <img id="modal-img" />
    </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
